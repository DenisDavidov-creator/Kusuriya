services:
  db:
    image: postgres:16
    ports:
      - :${DB_PORT}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable"
      - "up"

  seed:
    image: postgres:16
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./db/init/seed.sql:/seed.sql
    command:
      - "sh"
      - "-c"
      - "COUNT=$$(psql postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable -tAc 'SELECT count(*) FROM remedies'); if [ \"$$COUNT\" = \"0\" ]; then psql postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}?sslmode=disable -f /seed.sql; else echo 'already seeded'; fi"
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    depends_on:
      seed:
        condition: service_completed_successfully

  swagger-ui:
    image: swaggerapi/swagger-ui
    profiles: ["dev"]
    ports:
      - "8090:8080"
    environment:
      - SWAGGER_JSON=/swagger/swagger.json
    volumes:
      - ./docs:/swagger  

volumes:
  pgdata: